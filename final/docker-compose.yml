version: "3.9"

services:
  order:
    build:
      context: ./order
    container_name: order
    volumes:
      - ./order:/app/order
    ports:
      - "3000:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
  
  payment:
    build:
      context: ./payment
    container_name: payment
    volumes:
      - ./payment:/app/payment
    ports:
      - "3001:3001"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  product:
    build:
      context: ./product
    container_name: product
    volumes:
      - ./product:/app/product
    ports:
      - "3002:3002"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  api-gateway:
      image: nginx:latest
      container_name: api-gateway
      ports:
        - "8080:8080"  # API Gateway is exposed on port 8080
      volumes:
        - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Mount custom Nginx config
      depends_on:
        - order
        - payment
        - product
      networks:
        - backend  # Internal network for secure communication
  
  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    networks:
      - backend
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 5
  
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  backend:
    driver: bridge