version: "3.9"

services:
  order:
    build:
      context: ./order
    container_name: order
    volumes:
      - ./order:/app/order
    ports:
      - "3000:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
  
  payment:
    build:
      context: ./payment
    container_name: payment
    volumes:
      - ./payment:/app/payment
    ports:
      - "3001:3001"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  product:
    build:
      context: ./product
    container_name: product
    volumes:
      - ./product:/app/product
    ports:
      - "3002:3002"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  api-gateway:
      image: nginx:latest
      container_name: api-gateway
      ports:
        - "8080:8080"  # API Gateway is exposed on port 8080
      volumes:
        - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Mount custom Nginx config
      depends_on:
        - order
        - payment
        - product
      networks:
        - backend  # Internal network for secure communication
  
  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    networks:
      - backend
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 5

  configsvr:
    image: mongo:6
    container_name: configsvr
    command: ["mongod", "--configsvr", "--replSet", "configReplSet", "--port", "27017"]
    ports:
      - 27017:27017
    volumes:
      - config_data:/data/db

  shard1:
    image: mongo:6
    container_name: shard1
    command: ["mongod", "--shardsvr", "--replSet", "shardReplSet1", "--port", "27018"]
    ports:
      - 27018:27018
    volumes:
      - shard1_data:/data/db

  shard2:
    image: mongo:6
    container_name: shard2
    command: ["mongod", "--shardsvr", "--replSet", "shardReplSet2", "--port", "27019"]
    ports:
      - 27019:27019
    volumes:
      - shard2_data:/data/db

  mongos:
    image: mongo:6
    container_name: mongos
    depends_on:
      - configsvr
      - shard1
      - shard2
    command: >
      bash -c "
      sleep 10 &&
      mongos --configdb configReplSet/configsvr:27017 --bind_ip_all
      "
    ports:
      - 27020:27017

volumes:
  config_data:
  shard1_data:
  shard2_data:

networks:
  backend:
    driver: bridge